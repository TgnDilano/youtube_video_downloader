[toolchain]
# native_toolchain_rust requires an exact channel version/date for reproducible builds.
channel = "1.98.0"
# Only the host target is enabled for now. The full cross-platform target list
# (Android/iOS/Windows/Linux) must be restored for the per-platform release
# builds in Step 7, as each requires its std to be downloaded.
targets = [
  "aarch64-apple-darwin",
]
