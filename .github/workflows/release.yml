name: Build Releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package DMG
        run: |
          hdiutil create \
            -volname "TubeXMate" \
            -srcfolder "build/macos/Build/Products/Release/TubeXMate.app" \
            -ov -format UDZO \
            "TubeXMate-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: TubeXMate-macos.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "TubeXMate-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: TubeXMate-windows.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: artifacts

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
